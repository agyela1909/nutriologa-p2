<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida | Citas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f8f3;
            color: #333;
        }

        header {
            background-color: #4c956c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        nav {
            background-color: #2f6f4e;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #6aaf83;
        }

        .contenedor {
            width: 85%;
            max-width: 650px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        h2 {
            color: #2f6f4e;
            text-align: center;
        }

        .descripcion {
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #b7cdbd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #8fc7a1;
        }

        button {
            width: 100%;
            background-color: #4c956c;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2f6f4e;
        }

        #mensaje {
            text-align: center;
            color: #2f6f4e;
            font-weight: bold;
            margin-top: 20px;
        }

        footer {
            background-color: #2f6f4e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .contenedor {
                width: 85%;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Solicitar una cita</h1>
        <p>NutriVida: Tu salud también se alimenta</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="servicios.html">Servicios</a>
        <a href="consejos.html">Consejos</a>
        <a href="cita.html">Citas</a>
    </nav>

    <div class="contenedor">

        <h2>Formulario de contacto</h2>

        <p class="descripcion">
            Completa el siguiente formulario de demostración
            para practicar cómo solicitar una cita en NutriVida.
        </p>

        <form id="formulario">

            <label for="nombre">Nombre completo:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre"
                required
            >

            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required
            >

            <label for="fecha">Fecha solicitada:</label>
            <input
                type="date"
                id="fecha"
                name="fecha"
                required
            >

            <label for="hora">Horario preferido:</label>
            <select id="hora" name="hora" required>
                <option value="">Selecciona un horario</option>
                <option value="09:00">9:00 a. m.</option>
                <option value="10:00">10:00 a. m.</option>
                <option value="12:00">12:00 p. m.</option>
                <option value="16:00">4:00 p. m.</option>
            </select>

            <label for="motivo">Motivo de la consulta:</label>
            <select id="motivo" name="motivo" required>
                <option value="">Selecciona una opción</option>
                <option value="orientacion">
                    Orientación alimentaria
                </option>
                <option value="habitos">
                    Hábitos saludables
                </option>
                <option value="informacion">
                    Información general
                </option>
            </select>

            <label for="comentario">Comentario (opcional):</label>
            <textarea
                id="comentario"
                name="comentario"
                rows="4"
                placeholder="Escribe tu comentario"
            ></textarea>

            <button type="submit">
                Enviar formulario
            </button>

        </form>

        <p id="mensaje"></p>

    </div>

    <footer>
        <p>NutriVida © 2026 | Proyecto escolar</p>
    </footer>

    <script>
        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            mensaje.textContent =
                "¡Formulario enviado correctamente! Esta es una demostración.";

            formulario.reset();
        });
    </script>

</body>
</html>
